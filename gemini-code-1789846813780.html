<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Freelancer</title>
    <!-- Font Awesome for Social Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Dark blurred background matching the cozy artwork palette */
            background: linear-gradient(rgba(10, 10, 18, 0.75), rgba(10, 10, 18, 0.75)), 
                        url('https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&q=80&w=1600') no-repeat center center/cover;
            padding: 20px;
        }

        .card-container {
            display: flex;
            width: 100%;
            max-width: 900px;
            background-color: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            min-height: 550px;
        }

        /* Left side - Character Image Banner */
        .banner-side {
            flex: 1;
            position: relative;
            background: url('https://images.unsplash.com/photo-1654931800100-2ecf6eee7c64?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            padding: 30px;
        }

        .banner-side::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.1) 100%);
        }

        .logo {
            position: relative;
            z-index: 1;
            color: #ffffff;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Right side - Form */
        .form-side {
            flex: 1;
            padding: 40px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
        }

        .form-side h2 {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 25px;
        }

        .google-btn {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: #ffffff;
            color: #5f6368;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .google-btn:hover {
            background-color: #f8f9fa;
            border-color: #d0d0d0;
        }

        .divider {
            display: flex;
            align-items: center;
            width: 100%;
            margin: 20px 0;
            color: #999999;
            font-size: 12px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: #e6e6e6;
        }

        .divider span {
            padding: 0 10px;
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .input-group {
            position: relative;
            width: 100%;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            color: #333;
            transition: border-color 0.2s;
        }

        .input-group input::placeholder {
            color: #aaaaaa;
        }

        .input-group input:focus {
            border-color: #ff5722;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #888888;
            cursor: pointer;
            font-size: 14px;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(90deg, #ff5722, #ff6b00);
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 4px 12px rgba(255, 87, 34, 0.3);
            transition: opacity 0.2s, transform 0.1s;
        }

        .submit-btn:hover {
            opacity: 0.95;
        }

        .submit-btn:active {
            transform: scale(0.99);
        }

        .login-link {
            margin-top: 18px;
            font-size: 12px;
            color: #666666;
        }

        .login-link a {
            color: #ff5722;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .social-icons {
            display: flex;
            gap: 18px;
            margin-top: 24px;
        }

        .social-icons a {
            color: #777777;
            font-size: 16px;
            text-decoration: none;
            transition: color 0.2s;
        }

        .social-icons a:hover {
            color: #ff5722;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .card-container {
                flex-direction: column;
                max-width: 420px;
            }

            .banner-side {
                min-height: 220px;
            }

            .form-side {
                padding: 30px 25px;
            }
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Left Side with Image Banner & Logo -->
        <div class="banner-side">
            <div class="logo">FREELANCER</div>
        </div>

        <!-- Right Side with Sign Up Form -->
        <div class="form-side">
            <h2>Create Account</h2>

            <button type="button" class="google-btn">
                <span>Sign up with Google</span>
                <!-- Google G Logo SVG -->
                <svg width="16" height="16" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
            </button>

            <div class="divider">
                <span>or</span>
            </div>

            <form action="#" method="POST">
                <div class="input-group">
                    <input type="text" placeholder="Full Name" required>
                </div>

                <div class="input-group">
                    <input type="email" placeholder="Email Address" required>
                </div>

                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                    <i class="fa-regular fa-eye-slash password-toggle" id="togglePassword"></i>
                </div>

                <button type="submit" class="submit-btn">Create Account</button>
            </form>

            <div class="login-link">
                Already have an account? <a href="#">Log in</a>
            </div>

            <div class="social-icons">
                <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#"><i class="fa-brands fa-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
            </div>
        </div>
    </div>

    <script>
        // Password visibility toggle
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');

        togglePassword.addEventListener('click', function () {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
